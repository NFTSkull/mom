# Config local Supabase para el portal NOM-035 (proyecto local, sin link remoto).
# Este bloque NO aplica migraciones remotas ni ejecuta db push.
#
# NOTA DE PUERTOS (B4.2):
# Los puertos se desplazan al rango 55xxx para coexistir con otra instancia
# Supabase local ya presente en esta maquina (que ocupa 54321-54327).
# Asi mom-nom035-local no interfiere con proyectos ajenos del host.

project_id = "mom-nom035-local"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[db.pooler]
enabled = false
port = 55329

# Sin seed: el esquema se valida solo con migraciones + pruebas pgTAP.
[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
# Provider email habilitado para login/invitación; el signup público sigue
# bloqueado por [auth].enable_signup = false.
enable_signup = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# Analytics (logflare) desactivado: no se requiere para las pruebas de B4.2
# y evita el puerto 54327 usado por otra instancia local.
[analytics]
enabled = false
port = 55327
